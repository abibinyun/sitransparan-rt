services:
  traefik:
    image: traefik:3.6
    container_name: transparansi_traefik_prod
    restart: always
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - infrastructure_default

  postgres:
    image: postgres:16-alpine
    container_name: transparansi_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-transparansi_rt_prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ../backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-transparansi_rt_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - infrastructure_default

  minio:
    image: minio/minio:latest
    container_name: transparansi_minio_prod
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_prod_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - infrastructure_default

  backend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.backend.prod
    container_name: transparansi_backend_prod
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-transparansi_rt_prod}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_USE_SSL: "false"
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-production-super-secret-jwt-platform-rt-key}
      TENANT_BASE_DOMAIN: iscube.web.id
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@iscube.web.id}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=rt_prod_network"
      - 'traefik.http.routers.backend_prod.rule=Host(`api.iscube.web.id`) || HostRegexp(`^api\.[a-z0-9-]+\.iscube\.web\.id$`)'
      - "traefik.http.routers.backend_prod.entrypoints=web"
      - "traefik.http.services.backend_prod.loadbalancer.server.port=8080"
    networks:
      - infrastructure_default

  frontend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.frontend.prod
      args:
        VITE_TENANT_BASE_DOMAIN: iscube.web.id
    container_name: transparansi_frontend_prod
    restart: always
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=rt_prod_network"
      - 'traefik.http.routers.frontend_prod.rule=Host(`iscube.web.id`) || Host(`app.iscube.web.id`) || HostRegexp(`^[a-z0-9-]+\.iscube\.web\.id$`)'
      - "traefik.http.routers.frontend_prod.entrypoints=web"
      - "traefik.http.services.frontend_prod.loadbalancer.server.port=80"
    networks:
      - infrastructure_default

volumes:
  postgres_prod_data:
  minio_prod_data:

networks:
  infrastructure_default:
    external: true
