services:
  traefik:
    # traefik:v3.6+ required: older tags (<= v3.5) bundle a docker client that
    # pins API 1.24, which fails against modern daemons (Docker 25+, min API
    # 1.40+) with "client version 1.24 is too old" and never loads routers.
    image: traefik:3.6
    container_name: transparansi_traefik
    restart: always
    # NOTE: do NOT pin DOCKER_API_VERSION here; traefik negotiates the daemon
    # API version automatically when the variable is unset.
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro

  postgres:
    image: postgres:16-alpine
    container_name: transparansi_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-transparansi_rt}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-transparansi_rt}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: transparansi_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: transparansi_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.backend
    container_name: transparansi_backend
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-transparansi_rt}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_USE_SSL: "false"
      PORT: 8080
      # JWT signing secret. MUST be a long random value set in infrastructure/.env
      # (or the environment). There is no fallback default: a publicly-known
      # secret would let anyone forge JWTs for any tenant/role (CRITICAL).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - set it in infrastructure/.env (e.g. openssl rand -base64 48)}
      # Parent domain under which each tenant gets <slug>.<TENANT_BASE_DOMAIN>.
      # Must match the frontend build arg VITE_TENANT_BASE_DOMAIN.
      TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-openrt.local}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # Traefik v3 HostRegexp uses plain anchored regexes (the v2 {name:regex}
      # template syntax matches nothing in v3). The regex is anchored so a
      # suffix-trick host like rt-003.openrt.local.attacker.com never matches.
      - 'traefik.http.routers.backend.rule=Host(`api.${TENANT_BASE_DOMAIN:-openrt.local}`) || Host(`localhost`) || HostRegexp(`^api\.[a-z0-9-]+\.${TENANT_BASE_DOMAIN:-openrt.local}$`)'
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.frontend
      args:
        # Baked into the static bundle at build time; must match backend's
        # TENANT_BASE_DOMAIN so the frontend derives the same tenant slug.
        VITE_TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-openrt.local}
    container_name: transparansi_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - 'traefik.http.routers.frontend.rule=Host(`app.${TENANT_BASE_DOMAIN:-openrt.local}`) || Host(`${TENANT_BASE_DOMAIN:-openrt.local}`) || HostRegexp(`^[a-z0-9-]+\.${TENANT_BASE_DOMAIN:-openrt.local}$`)'
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

volumes:
  postgres_data:
  redis_data:
  minio_data:
