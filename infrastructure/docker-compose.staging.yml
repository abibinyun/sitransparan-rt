x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  traefik:
    <<: *default-logging
    image: traefik:3.6
    container_name: transparansi_traefik_staging
    restart: always
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--entrypoints.web.address=:80"
    ports:
      - "8082:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      infrastructure_default:
        aliases:
          - traefik-staging

  postgres:
    <<: *default-logging
    image: postgres:16-alpine
    container_name: transparansi_postgres_staging
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-transparansi_rt}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
      - ../backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-transparansi_rt}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      infrastructure_default:
        aliases:
          - postgres-staging

  minio:
    <<: *default-logging
    image: minio/minio:latest
    container_name: transparansi_minio_staging
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_staging_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      infrastructure_default:
        aliases:
          - minio-staging

  backend:
    <<: *default-logging
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.backend.staging
    container_name: transparansi_backend_staging
    restart: always
    environment:
      DB_HOST: postgres-staging
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-transparansi_rt}
      MINIO_ENDPOINT: minio-staging:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_USE_SSL: "false"
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-staging-secret-jwt-platform-rt-key}
      TENANT_BASE_DOMAIN: iscube.web.id
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-192.168.64.0/20,127.0.0.1}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - 'traefik.http.routers.backend_staging.rule=Host(`api-staging.iscube.web.id`) || HostRegexp(`^api\.[a-z0-9-]+-staging\.iscube\.web\.id$`) || HostRegexp(`^api-[a-z0-9-]+\.staging\.iscube\.web\.id$`)'
      - "traefik.http.routers.backend_staging.entrypoints=web"
      - "traefik.http.services.backend_staging.loadbalancer.server.port=8080"
    networks:
      infrastructure_default:
        aliases:
          - backend-staging

  frontend:
    <<: *default-logging
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.frontend.staging
      args:
        VITE_TENANT_BASE_DOMAIN: iscube.web.id
    container_name: transparansi_frontend_staging
    environment:
      BACKEND_UPSTREAM: backend-staging
    restart: always
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - 'traefik.http.routers.frontend_staging.rule=Host(`staging.iscube.web.id`) || Host(`app-staging.iscube.web.id`) || HostRegexp(`^[a-z0-9-]+-staging\.iscube\.web\.id$`) || HostRegexp(`^[a-z0-9-]+\.staging\.iscube\.web\.id$`)'
      - "traefik.http.routers.frontend_staging.entrypoints=web"
      - "traefik.http.services.frontend_staging.loadbalancer.server.port=80"
    networks:
      - infrastructure_default

volumes:
  postgres_staging_data:
    external: true
    name: infrastructure_postgres_data
  minio_staging_data:
    external: true
    name: infrastructure_minio_data

networks:
  infrastructure_default:
    external: true
