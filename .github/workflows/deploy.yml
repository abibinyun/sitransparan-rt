name: CI/CD Pipeline (PC Local Cloudflare Tunnel)

on:
  push:
    branches:
      - staging  # Staging trigger -> *.staging.iscube.web.id
      - main     # Production trigger -> *.iscube.web.id
  pull_request:
    branches:
      - main
      - staging

jobs:
  lint-and-test:
    name: Lint, Test & Build Verification
    runs-on: [self-hosted, pc-local]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Backend Vet & Test
        run: |
          cd backend
          /usr/local/go/bin/go vet ./...
          /usr/local/go/bin/go test -v ./...

      - name: Frontend Typecheck & Build
        run: |
          cd frontend
          npm ci
          npm run build

  deploy-staging:
    name: Deploy to Staging (*.staging.iscube.web.id)
    needs: lint-and-test
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: [self-hosted, pc-local]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build & Run Staging Containers
        run: |
          echo "Deploying Staging to *.staging.iscube.web.id..."
          cd infrastructure
          docker compose -f docker-compose.staging.yml build backend frontend
          docker compose -f docker-compose.staging.yml up -d
          echo "Staging deployment complete."

  deploy-production:
    name: Deploy to Production (*.iscube.web.id)
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, pc-local]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build & Run Production Containers
        run: |
          echo "Deploying Production to *.iscube.web.id..."
          cd infrastructure
          docker compose -f docker-compose.prod.yml build backend frontend
          docker compose -f docker-compose.prod.yml up -d
          echo "Production deployment complete."
