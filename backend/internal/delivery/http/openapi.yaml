components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AspirationInput:
      type: object
      required: [title, content, category]
      properties:
        title: { type: string }
        content: { type: string }
        category: { type: string, enum: [suggestion, complaint, question] }
        is_anonymous: { type: boolean }
    ResidentInput:
      type: object
      properties:
        full_name: { type: string }
        nik: { type: string, description: Dienkripsi AES-256-GCM di server }
        nik_hash: { type: string }
        kk_number: { type: string }
        gender: { type: string }
        birth_place: { type: string }
        birth_date: { type: string, format: date }
        address: { type: string }
        rt_rw: { type: string }
        phone: { type: string }
        is_head_of_family: { type: boolean }
        status: { type: string, enum: [pending, approved, rejected] }
        ktp_url: { type: string }
        kk_url: { type: string }
