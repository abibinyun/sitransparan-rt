openapi: 3.0.3
info:
  title: Platform RT API
  description: OpenAPI 3.0 specification for Platform RT REST API endpoints.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local server

paths:
  /health:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: Server status OK

  /api/v1/auth/login:
    post:
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
        '401':
          description: Unauthorized

  /api/v1/auth/register:
    post:
      summary: User registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email:
                  type: string
                password:
                  type: string
                name:
                  type: string
      responses:
        '201':
          description: Registration successful
        '400':
          description: Bad request

  /api/v1/auth/tenants:
    get:
      summary: List user tenants
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User tenants list

  /api/v1/superadmin/tenants:
    get:
      summary: List all tenants (SuperAdmin)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Tenant list
    post:
      summary: Create tenant (SuperAdmin)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name:
                  type: string
                slug:
                  type: string
                domain:
                  type: string
      responses:
        '201':
          description: Tenant created

  /api/v1/superadmin/tenants/{id}:
    put:
      summary: Update tenant (SuperAdmin)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tenant updated
    delete:
      summary: Delete tenant (SuperAdmin)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tenant deleted

  /api/v1/residents:
    get:
      summary: List residents
      security:
        - BearerAuth: []
          TenantHeader: []
      responses:
        '200':
          description: Resident list
    post:
      summary: Create resident
      security:
        - BearerAuth: []
          TenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Resident'
      responses:
        '201':
          description: Resident created

  /api/v1/residents/{id}:
    get:
      summary: Get resident details
      security:
        - BearerAuth: []
          TenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Resident details
    put:
      summary: Update resident
      security:
        - BearerAuth: []
          TenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Resident updated
    delete:
      summary: Delete resident
      security:
        - BearerAuth: []
          TenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Resident deleted

  /api/v1/residents/{id}/family:
    post:
      summary: Add family member
      security:
        - BearerAuth: []
          TenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Family member added

  /api/v1/residents/{id}/family/{familyId}:
    delete:
      summary: Delete family member
      security:
        - BearerAuth: []
          TenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: familyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Family member deleted

  /api/v1/financial/categories:
    get:
      summary: List fee categories
      security:
        - BearerAuth: []
          TenantHeader: []
      responses:
        '200':
          description: Category list
    post:
      summary: Create fee category
      security:
        - BearerAuth: []
          TenantHeader: []
      responses:
        '201':
          description: Category created

  /api/v1/financial/dues:
    get:
      summary: List dues payments
      security:
        - BearerAuth: []
          TenantHeader: []
      responses:
        '200':
          description: Dues payment list
    post:
      summary: Create dues payment
      security:
        - BearerAuth: []
          TenantHeader: []
      responses:
        '201':
          description: Dues payment created

  /api/v1/financial/transactions:
    get:
      summary: List financial transactions
      security:
        - BearerAuth: []
          TenantHeader: []
      responses:
        '200':
          description: Financial transactions list
    post:
      summary: Create financial transaction
      security:
        - BearerAuth: []
          TenantHeader: []
      responses:
        '201':
          description: Financial transaction created

  /api/v1/financial/upload:
    post:
      summary: Upload transaction proof file
      security:
        - BearerAuth: []
          TenantHeader: []
      responses:
        '200':
          description: Proof file uploaded

  /api/v1/events:
    get:
      summary: List events
      security:
        - BearerAuth: []
          TenantHeader: []
      responses:
        '200':
          description: Events list
    post:
      summary: Create event
      security:
        - BearerAuth: []
          TenantHeader: []
      responses:
        '201':
          description: Event created

  /api/v1/events/{id}:
    get:
      summary: Get event detail
      security:
        - BearerAuth: []
          TenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event detail
    put:
      summary: Update event
      security:
        - BearerAuth: []
          TenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event updated
    delete:
      summary: Delete event
      security:
        - BearerAuth: []
          TenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event deleted

  /api/v1/events/{id}/budgets:
    get:
      summary: List event budgets
      security:
        - BearerAuth: []
          TenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event budgets
    post:
      summary: Add event budget item
      security:
        - BearerAuth: []
          TenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Event budget item added

  /api/v1/events/{id}/rsvp:
    post:
      summary: Submit event RSVP
      security:
        - BearerAuth: []
          TenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event RSVP recorded

  /api/v1/events/{id}/sponsors:
    get:
      summary: List event sponsors
      security:
        - BearerAuth: []
          TenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event sponsors list
    post:
      summary: Create event sponsor
      security:
        - BearerAuth: []
          TenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Event sponsor created

  /api/v1/t/{slug}/aspirations:
    post:
      summary: Submit public tenant aspiration
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Aspiration submitted

  /api/v1/t/{slug}/needs:
    get:
      summary: List public tenant community needs
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Community needs list

  /api/v1/aspirations:
    get:
      summary: List aspirations
      security:
        - BearerAuth: []
          TenantHeader: []
      responses:
        '200':
          description: Aspirations list

  /api/v1/aspirations/{id}/respond:
    post:
      summary: Respond to aspiration
      security:
        - BearerAuth: []
          TenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Aspiration response updated

  /api/v1/needs:
    get:
      summary: List community needs
      security:
        - BearerAuth: []
          TenantHeader: []
      responses:
        '200':
          description: Community needs list
    post:
      summary: Create community need
      security:
        - BearerAuth: []
          TenantHeader: []
      responses:
        '201':
          description: Community need created

  /api/v1/needs/{id}:
    put:
      summary: Update community need
      security:
        - BearerAuth: []
          TenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Community need updated
    delete:
      summary: Delete community need
      security:
        - BearerAuth: []
          TenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Community need deleted

  /api/v1/t/{slug}/announcements:
    get:
      summary: List public tenant announcements
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Public announcements list

  /api/v1/t/{slug}/documents:
    get:
      summary: List public tenant documents
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Public documents list

  /api/v1/announcements:
    get:
      summary: List announcements
      security:
        - BearerAuth: []
          TenantHeader: []
      responses:
        '200':
          description: Announcement list
    post:
      summary: Create announcement
      security:
        - BearerAuth: []
          TenantHeader: []
      responses:
        '201':
          description: Announcement created

  /api/v1/announcements/{id}:
    put:
      summary: Update announcement
      security:
        - BearerAuth: []
          TenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Announcement updated
    delete:
      summary: Delete announcement
      security:
        - BearerAuth: []
          TenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Announcement deleted

  /api/v1/documents:
    get:
      summary: List documents
      security:
        - BearerAuth: []
          TenantHeader: []
      responses:
        '200':
          description: Documents list
    post:
      summary: Upload/create document
      security:
        - BearerAuth: []
          TenantHeader: []
      responses:
        '201':
          description: Document created

  /api/v1/documents/{id}:
    delete:
      summary: Delete document
      security:
        - BearerAuth: []
          TenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Document deleted

  /api/v1/dashboard/summary:
    get:
      summary: Get dashboard summary
      security:
        - BearerAuth: []
          TenantHeader: []
      responses:
        '200':
          description: Dashboard summary

  /api/v1/dashboard/reports/financial/export:
    get:
      summary: Export financial report (CSV/Excel)
      security:
        - BearerAuth: []
          TenantHeader: []
      parameters:
        - name: start_date
          in: query
          required: false
          schema:
            type: string
        - name: end_date
          in: query
          required: false
          schema:
            type: string
        - name: format
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Report export file

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    TenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-ID
  schemas:
    Resident:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        full_name:
          type: string
        nik:
          type: string
        phone:
          type: string
        house_number:
          type: string
        rt_rw:
          type: string
        status:
          type: string
