openapi: 3.0.3
info:
  title: Platform RT API
  description: |
    OpenAPI 3.0 specification for the Sitransparan RT/RW backend.

    Autentikasi: `Authorization: Bearer <jwt>` (HS256, valid 24 jam).
    Role: `superadmin`, `admin_rt`, `resident`.
    Konvensi akses pada deskripsi endpoint:
    - PUBLIC: tanpa autentikasi
    - AUTH: semua role terautentikasi
    - ADMIN: superadmin + admin_rt
    - SUPERADMIN: superadmin saja

    Tenant context hanya diambil dari JWT claims yang terverifikasi (header
    X-Tenant-ID, query param, dan subdomain TIDAK dipercaya). Endpoint publik
    `/api/v1/t/{slug}/...` me-resolve tenant dari slug di path.
  version: 2.0.0
servers:
  - url: http://localhost:8081
    description: Local server (Port 8081)
  - url: /
    description: Current host relative path

paths:
  /health:
    get:
      summary: Health check (PUBLIC)
      responses:
        '200':
          description: Server status OK

  /swagger/openapi.yaml:
    get:
      summary: OpenAPI specification YAML (PUBLIC)
      responses:
        '200':
          description: OpenAPI YAML

  # ------------------------------------------------------------------ Auth
  /api/v1/auth/login:
    post:
      summary: User login (PUBLIC)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
                tenant_id: { type: string, format: uuid, description: Opsional - tenant yang dipilih saat login }
      responses:
        '200':
          description: Login sukses - mengembalikan { token, user }
        '401':
          description: Kredensial salah

  /api/v1/auth/register:
    post:
      summary: Register user baru (PUBLIC). Hanya membuat user, TANPA mapping tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string }
                password: { type: string }
                phone: { type: string }
      responses:
        '201':
          description: User dibuat
        '400':
          description: Bad request (mis. email sudah terdaftar)

  /api/v1/auth/tenants:
    get:
      summary: Daftar tenant aktif milik user (AUTH)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Array tenant

  /api/v1/auth/switch-tenant:
    post:
      summary: Ganti tenant aktif, menerbitkan JWT baru ter-scope tenant tujuan (AUTH)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id: { type: string, format: uuid }
      responses:
        '200':
          description: JWT baru + user
        '403':
          description: User tidak ter-mapping ke tenant tersebut

  # ------------------------------------------------- Public tenant resources
  /api/v1/t/{slug}/info:
    get:
      summary: Info tenant publik (PUBLIC)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: '{ "data": { id, name, slug, domain, logo_url } }'
        '404':
          description: Tenant tidak ditemukan

  /api/v1/t/{slug}/announcements:
    get:
      summary: List pengumuman publik (PUBLIC)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        '200':
          description: '{ data: Announcement[], total }'

  /api/v1/t/{slug}/documents:
    get:
      summary: List dokumen publik (PUBLIC)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        '200':
          description: '{ data: Document[], total }'

  /api/v1/t/{slug}/aspirations:
    get:
      summary: List aspirasi publik - tanpa identitas resident (PUBLIC)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        '200':
          description: '{ data: Aspiration[], total }'
    post:
      summary: Submit aspirasi publik anonim - resident_id diabaikan (PUBLIC)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AspirationInput'
      responses:
        '201':
          description: Aspirasi dibuat

  /api/v1/t/{slug}/needs:
    get:
      summary: List kebutuhan lingkungan publik (PUBLIC)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        '200':
          description: '{ data: CommunityNeed[], total }'

  # ---------------------------------------------------- SuperAdmin tenants
  /api/v1/superadmin/tenants:
    get:
      summary: List seluruh tenant (SUPERADMIN)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        '200':
          description: '{ tenants: Tenant[], total }'
    post:
      summary: Buat tenant - schema tenant_<slug> diprovisikan otomatis; domain default <slug>.openrt.local (SUPERADMIN)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string }
                slug: { type: string }
                domain: { type: string }
                logo_url: { type: string }
      responses:
        '201':
          description: Tenant dibuat

  /api/v1/superadmin/tenants/{id}:
    get:
      summary: Detail tenant (SUPERADMIN)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Tenant
        '404':
          description: Tenant tidak ditemukan
    put:
      summary: Update tenant (SUPERADMIN)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string }
                slug: { type: string }
                domain: { type: string }
                logo_url: { type: string }
      responses:
        '200':
          description: Tenant diupdate
    delete:
      summary: Hapus tenant beserta schema tenant_<slug> (DROP SCHEMA CASCADE) (SUPERADMIN)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Tenant dihapus

  # --------------------------------------------------------------- Users
  /api/v1/users:
    get:
      summary: List user - superadmin scope global, admin_rt scope tenant-nya (ADMIN)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        '200':
          description: '{ data: UserWithRole[], total, limit, offset }'
    post:
      summary: Buat user - hanya superadmin yang boleh membuat role superadmin (ADMIN)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name: { type: string }
                email: { type: string }
                password: { type: string }
                phone: { type: string }
                role: { type: string, enum: [superadmin, admin_rt, resident] }
                tenant_id: { type: string, format: uuid, description: Hanya dipakai superadmin untuk scope global }
      responses:
        '201':
          description: User dibuat
        '403':
          description: Role escalation ditolak

  /api/v1/users/{id}:
    get:
      summary: Detail user (ADMIN)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: UserWithRole
    put:
      summary: Update user - role superadmin hanya oleh superadmin (ADMIN)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, role]
              properties:
                name: { type: string }
                email: { type: string }
                phone: { type: string }
                role: { type: string, enum: [superadmin, admin_rt, resident] }
                password: { type: string }
                tenant_id: { type: string, format: uuid }
      responses:
        '200':
          description: User diupdate
        '403':
          description: Role escalation ditolak
    delete:
      summary: Hapus user (ADMIN)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: User dihapus

  # ------------------------------------------------------------- Residents
  /api/v1/residents:
    get:
      summary: List warga - NIK tidak dikembalikan plaintext (ADMIN)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        '200':
          description: '{ data: Resident[], total, limit, offset }'
    post:
      summary: Buat warga - NIK dienkripsi AES-256-GCM (ADMIN)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResidentInput'
      responses:
        '201':
          description: Warga dibuat

  /api/v1/residents/{id}:
    get:
      summary: Detail warga (ADMIN)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Resident
        '404':
          description: Tidak ditemukan (termasuk resource tenant lain)
    put:
      summary: Update warga (ADMIN)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResidentInput'
      responses:
        '200':
          description: Warga diupdate
    delete:
      summary: Hapus warga (ADMIN)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Warga dihapus

  /api/v1/residents/{id}/approve:
    post:
      summary: Approve warga (ADMIN)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 'Warga di-approve: { message, status: "approved" }'

  /api/v1/residents/{id}/reject:
    post:
      summary: Reject warga (ADMIN)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 'Warga di-reject: { message, status: "rejected" }'

  /api/v1/residents/{id}/family:
    post:
      summary: Tambah anggota keluarga (ADMIN)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name: { type: string }
                nik: { type: string }
                relation: { type: string }
                birth_date: { type: string, format: date }
                gender: { type: string }
      responses:
        '201':
          description: Anggota keluarga ditambahkan

  /api/v1/residents/{id}/family/{memberId}:
    delete:
      summary: Hapus anggota keluarga (ADMIN)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Anggota keluarga dihapus

  /api/v1/residents/upload:
    post:
      summary: Upload file KTP/KK/dokumen (AUTH)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                type: { type: string, default: document }
      responses:
        '200':
          description: '{ file_url, type }'

  # ------------------------------------------------------------- Financial
  /api/v1/financial/categories:
    get:
      summary: List kategori iuran (AUTH)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        '200':
          description: '{ data: FeeCategory[], total }'
    post:
      summary: Buat kategori iuran (ADMIN)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                amount: { type: number }
                period: { type: string, enum: [monthly, one_time] }
                description: { type: string }
      responses:
        '201':
          description: Kategori dibuat

  /api/v1/financial/categories/{id}:
    get:
      summary: Detail kategori iuran (AUTH)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: FeeCategory
    put:
      summary: Update kategori iuran (ADMIN)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                amount: { type: number }
                period: { type: string, enum: [monthly, one_time] }
                description: { type: string }
      responses:
        '200':
          description: Kategori diupdate
    delete:
      summary: Hapus kategori iuran (ADMIN)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Kategori dihapus

  /api/v1/financial/summary:
    get:
      summary: Ringkasan kas RT - total income, expense, balance (AUTH)
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: FinancialSummary

  /api/v1/financial/dues:
    get:
      summary: List pembayaran iuran (AUTH)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: resident_id, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        '200':
          description: '{ data: DuesPayment[], total }'
    post:
      summary: Catat pembayaran iuran (ADMIN)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resident_id, fee_category_id, amount, period_month, period_year]
              properties:
                resident_id: { type: string, format: uuid }
                fee_category_id: { type: string, format: uuid }
                amount: { type: number }
                period_month: { type: integer }
                period_year: { type: integer }
                proof_url: { type: string }
      responses:
        '201':
          description: Pembayaran dicatat

  /api/v1/financial/dues/{id}/verify:
    post:
      summary: Verifikasi iuran (verified/rejected) (ADMIN)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [verified, rejected] }
      responses:
        '200':
          description: DuesPayment diupdate

  /api/v1/financial/transactions:
    get:
      summary: List transaksi kas - query type=income|expense (AUTH)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [income, expense] } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        '200':
          description: '{ data: FinancialTransaction[], total }'
    post:
      summary: Catat transaksi kas (ADMIN)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, category, amount]
              properties:
                type: { type: string, enum: [income, expense] }
                category: { type: string }
                amount: { type: number }
                transaction_date: { type: string, format: date }
                description: { type: string }
                proof_url: { type: string }
      responses:
        '201':
          description: Transaksi dicatat

  /api/v1/financial/transactions/{id}:
    get:
      summary: Detail transaksi (AUTH)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: FinancialTransaction
    put:
      summary: DITOLAK - ledger append-only, koreksi via reversing entry (405)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '405':
          description: Append-only ledger
    delete:
      summary: DITOLAK - deletion disabled (405)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '405':
          description: Append-only ledger

  /api/v1/financial/upload:
    post:
      summary: Upload bukti transfer (AUTH)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: '{ proof_url }'

  # ---------------------------------------------------------------- Events
  /api/v1/events:
    get:
      summary: List kegiatan (AUTH)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        '200':
          description: '{ data: Event[], total }'
    post:
      summary: Buat kegiatan (ADMIN)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
                event_date: { type: string, format: date-time }
                location: { type: string }
                status: { type: string, enum: [planned, ongoing, completed, cancelled] }
      responses:
        '201':
          description: Kegiatan dibuat

  /api/v1/events/{id}:
    get:
      summary: Detail kegiatan (AUTH)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Event
        '404':
          description: Tidak ditemukan
    put:
      summary: Update kegiatan (ADMIN)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                event_date: { type: string, format: date-time }
                location: { type: string }
                status: { type: string, enum: [planned, ongoing, completed, cancelled] }
      responses:
        '200':
          description: Kegiatan diupdate
    delete:
      summary: Hapus kegiatan (ADMIN)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Kegiatan dihapus

  /api/v1/events/{id}/budget:
    get:
      summary: List RAB/budget kegiatan (AUTH)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: EventBudget[]
    post:
      summary: Tambah/update item budget (ADMIN)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description: { type: string }
                estimated_cost: { type: number }
                actual_cost: { type: number }
      responses:
        '200':
          description: Item budget disimpan
    put:
      summary: Alias update item budget (ADMIN)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description: { type: string }
                estimated_cost: { type: number }
                actual_cost: { type: number }
      responses:
        '200':
          description: Item budget disimpan

  /api/v1/events/{id}/rsvp:
    post:
      summary: RSVP warga pada kegiatan (AUTH - termasuk resident)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resident_id, status]
              properties:
                resident_id: { type: string, format: uuid }
                status: { type: string, enum: [attending, absent, maybe] }
      responses:
        '200':
          description: RSVP dicatat

  /api/v1/events/{id}/roles:
    get:
      summary: List panitia acara (AUTH)
      security: [{ BearerAuth: [] }]
      parameters:
