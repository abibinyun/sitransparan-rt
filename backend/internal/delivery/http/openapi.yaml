        '400':
          description: event_type tidak valid

  # Upload guard (semua endpoint upload): maksimal 5 MB per file,
  # hanya JPG/PNG/WebP/PDF. Melebihi -> 400.

  /api/v1/push/config:
    get:
      summary: Status Web Push + kunci VAPID publik (PUBLIC)
      responses:
        '200':
          description: '{ enabled, public_key }'

  /api/v1/push/subscribe:
    post:
      summary: Simpan langganan Web Push (AUTH, identitas dari JWT)
      security: [{ BearerAuth: [] }]
      responses:
        '201':
          description: Langganan tersimpan
        '401':
          description: Login diperlukan

  /api/v1/push/unsubscribe:
    post:
      summary: Hapus langganan milik sendiri (AUTH)
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Langganan dihapus

  /api/v1/social/badge:
    get:
      summary: Badge partisipasi warga (AUTH) — dihitung dari reaksi + suara nyata
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: '{ reactions_given, votes_cast, total, level }'

  # ---------------------------------------------- Karang Taruna
  /api/v1/t/{slug}/karang-taruna:
    get:
      summary: Struktur organisasi pemuda publik aktif (PUBLIC)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: '{ period, members: [{ name, role, section, custom_title }] }'
        '404':
          description: Tenant tidak ditemukan

  /api/v1/t/{slug}/waste-bank/categories:
    get:
      summary: Katalog harga & kategori bank sampah publik (PUBLIC)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: '{ data: WasteCategory[] }'

  /api/v1/t/{slug}/waste-bank/summary:
    get:
      summary: Ringkasan transparansi bank sampah publik (PUBLIC)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: WasteBankSummary

  /api/v1/t/{slug}/waste-bank/households:
    get:
      summary: Peringkat tabungan sampah rumah tangga (PUBLIC)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: '{ data: HouseholdAccumulation[], total: number }'

  /api/v1/waste-bank/categories:
    get:
      summary: List kategori sampah (AUTH)
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: '{ data: WasteCategory[] }'
    post:
      summary: Buat kategori sampah & persentase bagi hasil (ADMIN)
      security: [{ BearerAuth: [] }]
      responses:
        '201':
          description: Created

  /api/v1/waste-bank/deposits:
    get:
      summary: List riwayat setoran sampah warga (AUTH)
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: '{ data: WasteDeposit[], total: number }'
    post:
      summary: Catat setoran sampah per KK & hitung bagi hasil (AUTH/ADMIN)
      security: [{ BearerAuth: [] }]
      responses:
        '201':
          description: Created

  /api/v1/waste-bank/summary:
    get:
      summary: Ringkasan metrik bank sampah tenant (AUTH)
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: WasteBankSummary

  /api/v1/waste-bank/households:
    get:
      summary: Rekapitulasi tabungan & bobot sampah per KK (AUTH)
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: '{ data: HouseholdWasteAccumulation[], total: number }'

  /api/v1/karang-taruna/periods:
    get:
      summary: List periode kepengurusan pemuda (AUTH)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, active, archived] } }
      responses:
        '200':
          description: '{ data: KarangTarunaPeriod[] }'
    post:
      summary: Buat periode masa bakti baru (ADMIN)
      security: [{ BearerAuth: [] }]
      responses:
        '201':
          description: Periode dibuat

  /api/v1/karang-taruna/periods/active:
    get:
      summary: Ambil periode aktif saat ini (AUTH)
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: KarangTarunaPeriod

  /api/v1/karang-taruna/periods/{id}:
    get:
      summary: Detail periode (AUTH)
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: KarangTarunaPeriod
    put:
      summary: Update periode (ADMIN)
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Periode diupdate

  /api/v1/karang-taruna/periods/{id}/config:
    put:
      summary: Update konfigurasi seksi dan peran kepengurusan (ADMIN / KETUA)
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Konfigurasi disimpan

  /api/v1/karang-taruna/members:
    get:
      summary: List anggota/pengurus periode (AUTH)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: period_id, in: query, schema: { type: string, format: uuid } }
        - { name: section, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [aktif, demisioner, nonaktif] } }
      responses:
        '200':
          description: '{ data: KarangTarunaMember[] }'
    post:
      summary: Tetapkan pengurus/anggota baru (ADMIN / KETUA)
      security: [{ BearerAuth: [] }]
      responses:
        '201':
          description: Anggota ditetapkan

  /api/v1/karang-taruna/members/{id}:
    put:
      summary: Update jabatan/seksi/status anggota (ADMIN / KETUA)
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Anggota diupdate
    delete:
      summary: Hapus anggota dari kepengurusan (ADMIN / KETUA)
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Anggota dihapus

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AspirationInput:
      type: object
      required: [title, content, category]
      properties:
        title: { type: string }
        content: { type: string }
        category: { type: string, enum: [suggestion, complaint, question] }
        is_anonymous: { type: boolean }
    ResidentInput:
      type: object
      properties:
        full_name: { type: string }
        nik: { type: string, description: Dienkripsi AES-256-GCM di server }
        nik_hash: { type: string }
        kk_number: { type: string }
        gender: { type: string }
        birth_place: { type: string }
        birth_date: { type: string, format: date }
        address: { type: string }
        rt_rw: { type: string }
        phone: { type: string }
        is_head_of_family: { type: boolean }
        status: { type: string, enum: [pending, approved, rejected] }
        ktp_url: { type: string }
        kk_url: { type: string }
