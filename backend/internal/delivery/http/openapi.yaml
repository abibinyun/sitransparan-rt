      summary: Beri/ubah reaksi — identitas dari JWT, 1 user 1 reaksi per target (AUTH)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_type, target_id, reaction]
